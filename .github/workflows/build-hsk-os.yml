name: Build Hsk OS Image
on: [workflow_dispatch]

jobs:
  compile:
    runs-on: windows-latest # Switches the cloud to a Windows server to build a real .exe
    steps:
      - name: Fetch Code Blueprint
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Compiler Tools
        run: |
          pip install pyinstaller

      - name: Compile Script into Windows EXE App
        run: |
          pyinstaller --noconsole --onefile --name="Hsk_OS_Desktop" hsk_os_app.py

      - name: Organize System Files Bundle
        run: |
          mkdir hsk_os_distribution
          mkdir hsk_os_distribution\SystemFiles
          mkdir hsk_os_distribution\DesktopThemes
          
          # Move your compiled executable app into the bundle folder
          copy dist\Hsk_OS_Desktop.exe hsk_os_distribution\

          # Write your system branding metadata documents
          echo Hsk-OS > hsk_os_distribution\SystemFiles\OS_Name.txt
          echo Version: 1.2.0-Pro >> hsk_os_distribution\SystemFiles\OS_Name.txt
          echo Welcome to Hsk OS! Double-click Hsk_OS_Desktop.exe to boot your workspace. > hsk_os_distribution\Welcome_Message.txt
          echo Taskbar_Position=Center > hsk_os_distribution\DesktopThemes\Windows_Layout.conf

      - name: Securely Save Downloadable Hsk OS App
        uses: actions/upload-artifact@v4
        with:
          name: Hsk-OS-App-Build
          path: hsk_os_distribution\
